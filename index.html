<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رسالة في زجاجة ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<audio id="song" loop preload="auto" src="song.mp3"></audio>
<canvas id="sky"></canvas>
<div id="moon"></div>
<div id="sea">
  <svg class="wave w1" viewBox="0 0 400 60" preserveAspectRatio="none"><path d="M0 30 Q50 6 100 30 T200 30 T300 30 T400 30 V60 H0Z"/></svg>
  <svg class="wave w2" viewBox="0 0 400 60" preserveAspectRatio="none"><path d="M0 30 Q50 6 100 30 T200 30 T300 30 T400 30 V60 H0Z"/></svg>
  <svg class="wave w3" viewBox="0 0 400 60" preserveAspectRatio="none"><path d="M0 30 Q50 6 100 30 T200 30 T300 30 T400 30 V60 H0Z"/></svg>
</div>
<div id="sand"></div>
<div id="bottle">
  <svg viewBox="0 0 80 190" id="bsvg">
    <g id="cork"><rect x="31" y="6" width="18" height="18" rx="3" fill="#b98a58"/></g>
    <path d="M32 22 h16 v26 c0 10 22 20 22 44 v70 c0 8 -6 14 -14 14 h-32 c-8 0 -14 -6 -14 -14 v-70 c0 -24 22 -34 22 -44z" fill="rgba(190,225,230,.28)" stroke="rgba(220,240,245,.7)" stroke-width="2"/>
    <g id="scroll"><rect x="26" y="95" width="28" height="62" rx="9" fill="#f1e2c4"/><rect x="26" y="118" width="28" height="5" fill="#c9566b" opacity=".85"/><path d="M33 100h14M33 106h14M33 132h14M33 138h14" stroke="#b79a6a" stroke-width="1.2"/></g>
    <path d="M22 100 v60" stroke="rgba(255,255,255,.45)" stroke-width="3" stroke-linecap="round"/>
  </svg>
</div>
<div id="hint">المسي الزجاجة</div>
<button id="mute">🔊</button>
<div id="paperWrap">
  <div id="paper">
    <p id="msg"></p>
    <button id="nextBtn">التالي ›</button>
    <button id="again">نقرأها تاني</button>
  </div>
</div>
<div id="intro">
  <h1>رسالة في زجاجة ✦</h1>
  <p>البحر جابلك حاجة من بعيد...</p>
  <button id="start">ابدأ</button>
</div>
<script src="script.js"></script>
</body>
</html>
